[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "thiserror@1.0.69", reason = "winit 0.30's Wayland stack (smithay-client-toolkit 0.19, calloop 0.13) requires thiserror 1, and eframe 0.36 pins winit 0.30; winit 0.31's Wayland stack requires thiserror 2" },
  { crate = "thiserror-impl@1.0.69", reason = "the proc macro behind thiserror 1.0.69, arriving by the same winit 0.30 Wayland path" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]




# Pinned for reproducible local and CI gates. See docs/tooling.md.
[tools]
"cargo:cargo-nextest" = "0.9.137"
"cargo:cargo-deny" = "0.20.2"
"cargo:trunk" = "0.21.14"
"cargo:wasm-pack" = "0.15.0"
# The roadmap planner and its test suite are TypeScript run through node's own
# type stripping and test runner, so the gate that executes them needs a pinned
# runtime like every other tool here. `package.json` declares the floor the type
# stripping needs; this pin is the version the gate actually runs.
node = "22.23.1"
# The workflows are the one part of the verification surface no compiler reads.
# `actionlint` checks their syntax and expressions; `zizmor` audits them for
# injection and permission findings. Both are pinned like every other tool here so
# a linter version bump is a reviewed change rather than a surprise red gate.
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.0"

[tasks.run]
alias = 'r'
description = "run"
# Bare `cargo run` takes shell's default features, and `persistence` is one of
# them, so this launches the binary that saves and restores the Source revision.
# That is the point of the default: the thing a developer runs is the thing that
# ships. `cargo run --no-default-features` is the feature-off build.
run = 'cargo run'

[tasks.test]
alias = 't'
description = "All test"
run = 'cargo nextest run --no-fail-fast --nocapture'

[tasks.test_shell]
alias = 'ts'
description = "Shell tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package shell --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.test_orcvs]
alias = 'to'
description = "Orcvs tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package orcvs --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.test_lang]
alias = 'tl'
description = "Lang tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package lang --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.miri]
description = "Interpret the Source model tests under Miri"
# Deliberate and non-gating, and nothing here calls it. `verification-gaps/12`
# decided the contract stops *requiring* Miri while keeping it the tool the
# unsafe gate would prefer; this task is the deliberate path that decision
# points at, not a tier a change owes. It is absent from `check`,
# `check_pull_request`, and `check_merge` on purpose, and
# `.github/workflows/miri.yml` runs it on manual dispatch only.
#
# Miri ships on nightly and nothing else. `rust-toolchain.toml` pins stable with
# two components and AGENTS.md keeps nightly optional, so the task installs the
# channel and the component it needs for the length of the run rather than
# moving the pin and making every other gate nightly's problem.
#
# Scoped by test filter, not by crate. `orcvs` links ALSA through `midir` in the
# default-featured build this task runs — `native-midi` is what decides that —
# and builds a multi-threaded Tokio runtime, and Miri can execute neither: it
# has no foreign functions and no real threads to hand them. But Miri interprets what
# actually runs, not what the crate links, so a dependency no selected test
# calls never becomes a problem. The filter selects the tests in the module that
# holds the one unsafe block in shipped code — the in-place ASCII byte write in
# `Source::set_source`, `orcvs/src/source/model.rs` — which are the tests that
# reach it. `nextest` gives each of them its own interpreter context, so Miri's
# leak check at termination reports per test rather than per binary.
run = '''
rustup toolchain install nightly --component miri
cargo +nightly miri nextest run --package orcvs -E 'test(/^source::model::test::/)'
'''

[tasks.bench]
description = "Benchmark the lang execution paths and the populated Source paths"
# `--benches` keeps the orcvs integration-test harnesses out, and each benchmarked
# crate sets `[lib] bench = false` to keep its unit-test harness out. Every one of
# them rejects `--output-format` and fails the task before criterion runs.
run = 'cargo bench --package lang --package orcvs --benches --locked -- --output-format bencher'

[tasks.check]
description = "Full repository verification gate"
run = '''
mise run check_pull_request
mise run check_merge
'''

[tasks.check_pull_request]
description = "Pull-request verification tier"
# Property tests run 32 cases here and the 256-case proptest default in the merge
# tier. Task-level so every run line stays byte-identical to the text
# scripts/check-tooling-contract.sh pins.
env = { PROPTEST_CASES = '32' }
run = '''
bash scripts/check-tooling-contract.sh
# The contract runs here; its fixture suite does not. The suite's verdict depends
# only on the files `make_fixture` copies, so `.github/workflows/tooling.yml`
# runs it path-filtered on those instead of twice on every pull request.
actionlint
zizmor --offline .github/workflows
node --test scripts/tests/roadmap.test.ts
node scripts/roadmap.ts > /dev/null
mise run audit_deps
cargo fmt --all -- --check
# Each pair below is default-features then `--no-default-features`. `shell`
# enables `persistence` by default and pulls `orcvs/persistence` with it, so the
# plain lines are the shipped configuration and the paired line is the only thing
# that still compiles and runs the feature-off build. Naming `--features
# persistence` here would name the default twice and test one configuration.
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
# `native-midi` is on by default, so every line above and below this one builds
# the crate one way — the `--no-default-features` line included, because `shell`
# names the feature for its native targets and workspace resolution hands it
# back. These two build it the other way, and they are scoped to `orcvs` because
# it is the only crate the feature reaches. Crossed with `persistence` rather
# than run twice plain, so the four feature cells are all compiled between here
# and the lines around it, and the plain pass is the one that runs, because the
# tests that state what disabling the feature gives up are compiled only with it
# off.
cargo clippy --package orcvs --all-targets --no-default-features --features persistence --locked -- -D warnings
cargo nextest run --package orcvs --no-default-features --profile ci --locked
cargo nextest run --workspace --profile ci --locked
cargo nextest run --workspace --tests --no-default-features --profile ci --locked
cargo test --workspace --doc --locked
cargo test --workspace --doc --no-default-features --locked
'''

[tasks.check_merge]
description = "Merge verification tier"
run = '''
case "${ORCVS_MERGE_COMPONENT:-all}" in
  native) mise run check_merge_native ;;
  # What is merge-only on the WASM side is the browser run. The compile-and-build
  # half is `check_wasm`, which the WASM job runs as its own step on every event,
  # so this component narrows to what the step before it did not do. `all` below
  # still runs both, which is the path a local `mise run check` takes.
  wasm) mise run test_wasm ;;
  all)
    mise run check_merge_native
    mise run check_wasm
    mise run test_wasm
    ;;
  *) echo "unknown merge component: $ORCVS_MERGE_COMPONENT" >&2; exit 2 ;;
esac
'''

[tasks.check_merge_native]
description = "Native merge-only verification gates"
run = '''
mise run test_persistence
RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
cargo deny --locked check
'''

[tasks.test_persistence]
description = "Test persistence features"
# `persistence` is a default feature of `shell`, so every `--features
# persistence` below names a feature the workspace runs would enable anyway. It
# is kept explicit rather than trimmed: this task is what `orcvs`'s own
# persistence is verified through — `orcvs` still declares `default = []` and the
# `--package orcvs --lib` line has no other way to reach the feature — and the
# task keeps its meaning if the shell default ever moves. What is merge-only here
# is the case count: `check_pull_request` sets PROPTEST_CASES to 32 and this runs
# proptest's 256-case default.
run = '''
cargo check --package orcvs --lib --features persistence --locked
cargo clippy --workspace --all-targets --features persistence --locked -- -D warnings
cargo nextest run --workspace --all-targets --features persistence --profile ci --locked
cargo test --workspace --doc --features persistence --locked
RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --features persistence --locked
'''

[tasks.check_wasm]
description = "Check and build the WASM application"
run = '''
# `--lib` type-checks no test target, which is how the browser regression suite
# stopped compiling and stayed that way. `--all-targets` covers every member's
# library exactly as `--lib` did and adds the test targets beside them.
cargo clippy --workspace --all-targets --target wasm32-unknown-unknown --locked -- -D warnings
cd shell
# The default build is the persisting one, so the second build is what proves the
# WASM application still compiles with the storage path removed.
env -u NO_COLOR trunk build --locked
env -u NO_COLOR trunk build --no-default-features --locked
'''

[tasks.test_wasm]
description = "Run browser regressions in headless Firefox"
# No feature flag: the browser suite runs the configuration the browser ships,
# and `persistence` is in it by default. Adding `--no-default-features` here
# would spend a second headless Firefox run on a build `check_wasm` already
# compiles.
run = 'wasm-pack test --headless --firefox shell --test wasm --locked'

[tasks.audit_deps]
description = "Audit advisories, licenses, sources, and duplicate dependencies"
run = '''
cargo tree --workspace --all-features -e features --locked
cargo deny --locked check
# What `native-midi` is for is a claim about this tree, so the claim is checked
# here rather than described in a comment somewhere. With the feature off,
# `orcvs` reaches no platform MIDI service and so needs no system audio library:
# `midir` and the ALSA and CoreMIDI crates beneath it are all absent. `cargo
# tree` resolves the host target, so the Linux and macOS runners between them
# check this against both libraries a native build could otherwise link.
native_midi_tree="$(cargo tree --package orcvs --no-default-features --edges normal --prefix none --locked)"
if printf '%s\n' "$native_midi_tree" | grep -E '^(midir|alsa|alsa-sys|coremidi|coremidi-sys) '; then
  echo 'orcvs without native-midi still carries midir or a system audio library' >&2
  exit 1
fi
'''

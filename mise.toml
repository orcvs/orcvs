


# Pinned for reproducible local and CI gates. See docs/tooling.md.
[tools]
"cargo:cargo-nextest" = "0.9.137"
"cargo:cargo-deny" = "0.20.2"
"cargo:trunk" = "0.21.14"
"cargo:wasm-pack" = "0.15.0"

[tasks.run]
alias = 'r'
description = "run"
run = 'cargo run'

[tasks.test]
alias = 't'
description = "All test"
run = 'cargo nextest run --no-fail-fast --nocapture'

[tasks.test_shell]
alias = 'ts'
description = "Shell tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package shell --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.test_orcvs]
alias = 'to'
description = "Orcvs tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package orcvs --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.test_lang]
alias = 'tl'
description = "Lang tests"
env = { RUST_BACKTRACE = 'full' }
run = 'cargo nextest run --package lang --no-fail-fast --nocapture {{arg(name="test",default="")}}'

[tasks.bench]
description = "Benchmark the lang execution paths and the populated Source paths"
# `--benches` keeps the orcvs integration-test harnesses out, and each benchmarked
# crate sets `[lib] bench = false` to keep its unit-test harness out. Every one of
# them rejects `--output-format` and fails the task before criterion runs.
run = 'cargo bench --package lang --package orcvs --benches --locked -- --output-format bencher'

[tasks.check]
description = "Full repository verification gate"
run = '''
bash scripts/check-tooling-contract.sh
mise run check_pull_request
mise run check_merge
'''

[tasks.check_pull_request]
description = "Pull-request verification tier"
run = '''
cargo fmt --all -- --check
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo nextest run --workspace --profile ci --locked
cargo test --workspace --doc --locked
'''

[tasks.check_merge]
description = "Merge verification tier"
run = '''
case "${ORCVS_MERGE_COMPONENT:-all}" in
  native) mise run check_merge_native ;;
  wasm)
    mise run check_wasm
    mise run test_wasm
    ;;
  all)
    mise run check_merge_native
    mise run check_wasm
    mise run test_wasm
    ;;
  *) echo "unknown merge component: $ORCVS_MERGE_COMPONENT" >&2; exit 2 ;;
esac
'''

[tasks.check_merge_native]
description = "Native merge-only verification gates"
run = '''
mise run test_persistence
RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
cargo deny --locked check
'''

[tasks.test_persistence]
description = "Test persistence features"
run = '''
cargo check --package orcvs --lib --features persistence --locked
cargo clippy --workspace --all-targets --features persistence --locked -- -D warnings
cargo nextest run --workspace --all-targets --features persistence --profile ci --locked
cargo test --workspace --doc --features persistence --locked
RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --features persistence --locked
'''

[tasks.check_wasm]
description = "Check and build the WASM application"
run = '''
cargo clippy --workspace --lib --target wasm32-unknown-unknown --features persistence --locked -- -D warnings
cd shell
env -u NO_COLOR trunk build --locked
env -u NO_COLOR trunk build --features persistence --locked
'''

[tasks.test_wasm]
description = "Run browser regressions in headless Firefox"
run = 'wasm-pack test --headless --firefox shell --test wasm --features persistence --locked'

[tasks.audit_deps]
description = "Audit advisories, licenses, sources, and duplicate dependencies"
run = '''
cargo tree --workspace --all-features -e features --locked
cargo deny --locked check
'''

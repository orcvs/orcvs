[package]
name = "shell"
version = "0.1.0"
authors = []
edition.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "shell"
path = "src/lib.rs"

[[bin]]
name = "shell"
path = "src/main.rs"

[features]
default = []
persistence = ["eframe/persistence", "orcvs/persistence"]

[dependencies]
orcvs = { path = "../orcvs", version = "0.1.0" }
# Keep both Linux window backends explicit because disabling eframe defaults removes them.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.1", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "std",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-test = "0.3"

[dev-dependencies]
lang = { path = "../lang", version = "0.1.0" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }


[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]


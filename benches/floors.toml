# Benchmark floors: named ceilings on the bencher-format numbers `mise run bench`
# prints, held separately from the ratio gate in `.github/workflows/bench.yml`.
# `scripts/check-bench-floors.ts` reads this file and the same `output.txt` the
# ratio gate reads; it runs the benchmarks a second time for nobody.
#
# Why this exists beside the ratio gate rather than instead of it:
# `benchmark-action/github-action-benchmark` only ever compares a run against the
# previous point stored for `main`, so a deliberately accepted regression
# re-baselines the series in silence — the next pull request is judged against
# the worse number, and nothing says so again. The ratio gate answers "did this
# change make it worse"; this file answers "is it still as good as we agreed it
# should be". See
# `.scratch/benchmarks/issues/07-hold-a-named-benchmark-to-a-recorded-floor.md`.
#
# A benchmark absent from this file is unguarded: the check passes it without
# comment. Raising a figure is a plain edit here, visible in the diff a
# reviewer approves — the check never edits this file itself, and it fails
# loudly rather than silently if a guarded name disappears from the benchmark
# output (a rename must not be able to drop a guard by accident).
#
# Fields, one [[floor]] table per guarded benchmark:
#   name    — the bencher-format name exactly as `mise run bench` prints it in
#             the `test <name> ... bench: ...` line. A benchmark inside a
#             criterion `benchmark_group` would carry its `group/parameter`
#             form here unchanged.
#   max_ns  — the highest figure this benchmark may report, in nanoseconds. A
#             result strictly greater than this fails the check. criterion's
#             bencher formatter never scales a wall-clock measurement past
#             nanoseconds (`DurationFormatter::scale_for_machines` always
#             returns `"ns"` in criterion 0.8.2's `measurement.rs`), so every
#             benchmark this workspace runs reports in this unit.
#   runner  — the machine the figure was measured on. Without this a figure is
#             not reproducible: `sequence-values/02` measured a 4.03x ratio
#             locally against CI's 5.58x for the same change, and 3.27x locally
#             against CI's 3.68x for the same fix, so a number from one machine
#             is not interchangeable with a number from the other.
#   source  — how the figure was derived, for whoever next decides whether
#             raising it is warranted.
#
# This is a deliberately restricted TOML subset — flat `key = value` pairs
# inside `[[floor]]` array-of-table blocks, no nested tables, no multi-line
# strings, no arrays — hand-parsed by `scripts/check-bench-floors.ts` the same
# way `scripts/check-tooling-contract.sh` hand-parses `mise.toml`: this
# workspace carries no TOML dependency, and pulling one in to read four flat
# fields would be a dependency this file cannot give a rationale for.

[[floor]]
name = "execute_function"
max_ns = 60
# The runner both bench jobs in .github/workflows/bench.yml run on.
runner = "ubuntu-latest (GitHub Actions hosted runner)"
# One scalar Add through `Interpreter::execute_function`, the call a Turn makes.
# It guards the Operand Stack seam, which every call passes through. 60 ns
# is about twice the local figure, headroom for the runner noise
# `docs/tooling.md` describes as tens of percent between runs. This is a
# starting figure, not a measured floor with settled runs behind it; tighten it
# once the series has enough points on `gh-pages` to show where the call
# settles on this runner.
source = "Local criterion runs of execute_function at 30-31 ns on an Apple Silicon laptop; 60 ns chosen with headroom for the hosted runner, not yet CI-measured."

# The four `paint_derive` floors below guard the fix
# `.scratch/paint-cell-cost/issues/03-remove-the-paint-claim-cache-without-caching-paint-on-the-language-map.md`
# made: `console/benches/paint.rs` times `Paint::derive_with_theme`, whose
# pre-fix cost was a per-Cell HashMap lookup against a pointer-keyed claim
# cache. `fitted/16x16` and `culled/16x16` guard that per-Cell rate at the
# smallest Grid, where fitted and culled coincide. `fitted/256x256` guards the
# same rate scaled across a full 256x256 Grid, where the removed cache also
# paid an allocation and redistribution cost that grew with Grid size.
# `culled/256x256` guards the claim `console/benches/paint.rs` itself makes —
# that a fixed 16x16 window stays flat as the underlying Source grows — at the
# largest Grid this file benchmarks. Each `max_ns` sits with headroom over the worse of the two
# accepted-fix CI attempts, wide enough to absorb the "tens of per cent"
# hosted-runner noise `docs/tooling.md` describes, while staying well below
# the pre-fix figures (~11,700-11,912 ns at 16x16 and culled/256x256;
# ~3,205,954 ns, about 3.2 ms, at fitted/256x256) so a regression that brings
# the per-Cell HashMap cost back still fails here.
[[floor]]
name = "paint_derive/fitted/16x16"
max_ns = 4200
runner = "ubuntu-latest (GitHub Actions hosted runner)"
# Accepted fix `f394d81`, workflow run 35548734385 (job `pull-request`):
# attempt 1 measured 2,842 ns, attempt 2 measured 2,133 ns. 4,200 ns is ~48%
# headroom over the worse (2,842 ns) attempt and well below the pre-fix
# baseline of 11,794 ns recorded for the same benchmark on the same runner.
source = "CI-measured figures recorded in .scratch/paint-cell-cost/issues/04-prove-paint-recovered-without-making-source-revisions-slower.md (accepted f394d81, workflow run 35548734385, baseline run 35503614546); 4200 ns chosen with headroom above the worse of the two attempt figures, not independently re-measured for this file."

[[floor]]
name = "paint_derive/culled/16x16"
max_ns = 4100
runner = "ubuntu-latest (GitHub Actions hosted runner)"
# Accepted fix `f394d81`, workflow run 35548734385: attempt 1 measured
# 2,820 ns, attempt 2 measured 2,132 ns. 4,100 ns is ~45% headroom over the
# worse attempt and well below the pre-fix baseline of 11,702 ns for the same
# benchmark.
source = "CI-measured figures recorded in .scratch/paint-cell-cost/issues/04-prove-paint-recovered-without-making-source-revisions-slower.md (accepted f394d81, workflow run 35548734385, baseline run 35503614546); 4100 ns chosen with headroom above the worse of the two attempt figures, not independently re-measured for this file."


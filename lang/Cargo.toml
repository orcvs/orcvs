[package]
name = "lang"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `cargo bench` would otherwise also run the unit-test harness, which does not
# understand criterion's arguments.
bench = false

[dependencies]
arrayvec.workspace = true
# ADR 0013 names ChaCha8 for Random. No workspace crate already ships a
# deterministic portable generator, and inventing one would make native and
# wasm32 streams a second thing to keep in step. Default features stay off:
# `std` is only ppv-lite86 CPU detection, `serde` is a proc-macro this crate
# does not need, and the crate has no OS-randomness feature to turn on.
# `rand_core` 0.10 — the only required transitive — has no dependencies and
# no `os_rng` feature. Version 0.10 matches the ADR (MSRV 1.85, MIT OR
# Apache-2.0, no build script).
rand_chacha = { version = "0.10.0", default-features = false }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.18", features = [
    "fmt",
], default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Property tests are confined to native targets. Every invariant they encode is
# platform-independent logic, so running them under `wasm-pack` adds a dependency
# graph to maintain and no signal; this `cfg` keeps proptest out of the WASM graph
# entirely. The property modules carry the matching `cfg`. See docs/tooling.md.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[bench]]
name = "lang"
harness = false

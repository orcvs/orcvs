name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Everything that can move a measurement: the benchmarked crates, the profile and
    # resolved dependency versions they compile under, the toolchain, the command, and
    # the gate's own definition. `orcvs/**` covers the Source, the Language Map, and
    # the Render Frame. The memory series needs no entry of its own: it is measured by
    # `lang/tests/allocation.rs` and `orcvs/tests/allocation.rs`, which the two crate
    # globs already cover. Repeated because Actions does not support YAML anchors.
    paths:
      - 'lang/**'
      - 'orcvs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - '.github/workflows/bench.yml'
  pull_request:
    branches: [main]
    # Everything that can move a measurement: the benchmarked crates, the profile and
    # resolved dependency versions they compile under, the toolchain, the command, and
    # the gate's own definition. `orcvs/**` covers the Source, the Language Map, and
    # the Render Frame. The memory series needs no entry of its own: it is measured by
    # `lang/tests/allocation.rs` and `orcvs/tests/allocation.rs`, which the two crate
    # globs already cover. Repeated because Actions does not support YAML anchors.
    paths:
      - 'lang/**'
      - 'orcvs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - '.github/workflows/bench.yml'

# Granted per job. The publishing job writes repository contents; the pull-request job
# must not, so it never receives the permission at all.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Measures the merged result and appends it to the series on gh-pages.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # A release build of both benchmarked crates, then criterion twice: the warm-up
    # run and the measured one. Generous against that, and still far short of the
    # six hours an unbounded job can hold.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    # A run cancelled partway through publishing leaves the stored series half written.
    concurrency:
      group: bench-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      # A cache saved on a pull request's ref can only ever be read back by that
      # same pull request, so saving there fills the repository's shared quota
      # with entries nobody reads and evicts the ones on `main` that every run
      # restores from. Restoring is unaffected: a pull request still reads
      # `main`'s cache through the key prefix.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Both jobs below build the same tree under the same profile, and only
          # one of them ever runs. Without a shared key each gets a cache of its
          # own keyed on the job id, so the same bytes are stored twice.
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `orcvs` depends on `midir`, which links ALSA on Linux. Without this the bench
      # jobs fail while building `alsa-sys` and publish nothing.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      # `mise run bench` needs only cargo, which the toolchain step provides. Without
      # this, mise builds cargo-nextest, cargo-deny, trunk, and wasm-pack from source:
      # ten minutes for tools this job never invokes.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # The first run after a fresh compile is contaminated: measured locally,
      # parse_source reported 1,204 ns on the first run and a settled 417 ns on the
      # three that followed. CI only ever runs a freshly compiled binary, so the
      # first result is discarded.
      - name: Warm up
        run: mise run bench > /dev/null
      - name: Run benchmarks
        # `shell: bash` supplies `pipefail`. The default `bash -e` reports the exit
        # status of `tee`, so a failed benchmark run would pass this step and publish
        # whatever partial output it had already written.
        shell: bash
        run: mise run bench | tee output.txt
      - name: Publish and compare
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          # The action keys the stored series by this name. It must never change.
          name: lang
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-threshold: '300%'
          fail-on-alert: true
      # The allocation counts, taken from the very test functions that assert on them.
      # `lang/tests/allocation.rs` and `orcvs/tests/allocation.rs` print one record per
      # measurement when `ORCVS_MEMORY_SERIES` is set, and assert over the same numbers
      # in the same run, so the published number and the asserted number cannot drift
      # apart. A separate binary re-running the measured paths would let them drift
      # silently, which is what this series exists to make visible.
      #
      # `cargo test`, not `cargo nextest run`: `mise-action` above runs with
      # `install: false`, so this job holds no cargo tool beyond the toolchain, and
      # keeping it that way is why this step installs none either. A bare `cargo test`
      # shares one process across each binary's test threads, which is exactly the case
      # the `const`-initialised thread-local counters in those files are correct for.
      #
      # No warm-up run, unlike the timing series above. An allocation count is
      # deterministic for a fixed input, so a first run produces the second run's
      # numbers; warming up would double this step's cost for no signal at all.
      - name: Measure allocations
        # `shell: bash` supplies `pipefail`, for the reason the benchmark run above
        # gives: without it a failed assertion would pass this step and publish
        # whatever partial output the tests had already written.
        shell: bash
        run: ORCVS_MEMORY_SERIES=1 cargo test --package lang --package orcvs --test allocation --locked -- --nocapture | tee allocations.txt
      - name: Assemble the memory series
        # Shell builtins and coreutils only: no `jq`, no addition to `mise.toml`, and so
        # nothing new for this job to install. Each test already prints a complete
        # `customSmallerIsBetter` object, so this strips the marker, sorts for a
        # reproducible file, joins the records with commas and wraps them in an array.
        # `cut -d'"' -f4` reads each record's name back to reject a duplicate, which the
        # action would otherwise store as two points of one series; the names carry no
        # quote of their own, which is stated where they are built.
        shell: bash
        run: |
          # `|| true` because the step runs under `-eo pipefail`: without it a
          # `grep` that matches nothing makes the assignment fail and `errexit`
          # kills the step here, before the diagnostic below can say why.
          # `grep -o` rather than a `^`-anchored match because libtest only
          # suppresses its own partial `test <name> ... ` line prefix when it
          # runs tests concurrently, so an anchored pattern would drop every
          # record on a single-core runner or under `RUST_TEST_THREADS=1`.
          records="$(grep -o 'ORCVS-MEMORY-SERIES .*' allocations.txt | cut -d' ' -f2- | LC_ALL=C sort || true)"
          if [ -z "$records" ]; then
            echo 'the allocation tests published no records' >&2
            exit 1
          fi
          # Emptiness is not enough: the two test binaries publish
          # independently, so renaming the marker in one of them leaves the
          # other's records arriving and half the series silently stops
          # receiving points. Each crate is named in its own records, so
          # requiring both says the whole measurement arrived.
          for crate in lang orcvs; do
            if ! printf '%s\n' "$records" | grep -q "\"name\": \"$crate "; then
              echo "the $crate allocation tests published no records" >&2
              exit 1
            fi
          done
          duplicates="$(printf '%s\n' "$records" | cut -d'"' -f4 | LC_ALL=C uniq -d)"
          if [ -n "$duplicates" ]; then
            printf 'two records share one series name:\n%s\n' "$duplicates" >&2
            exit 1
          fi
          printf '[%s]\n' "$(printf '%s\n' "$records" | paste -sd, -)" > memory.json
          cat memory.json
      - name: Publish and compare allocations
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          # The action keys the stored series by this name, and it must never change,
          # for the same reason the `lang` name above must not: a rename does not move
          # the history, it starts an empty series beside it.
          name: memory
          tool: customSmallerIsBetter
          output-file-path: memory.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # The step above has already fetched `gh-pages` and pushed to it in this same
          # job, so fetching it again would discard the commit that step just made.
          skip-fetch-gh-pages: true
          # Far tighter than the timing series' 150%/300%, because an allocation count
          # is deterministic for a fixed input: there is no busy-runner noise for a
          # threshold to sit above, so anything past a few per cent is a real change.
          alert-threshold: '110%'
          comment-on-alert: true
          # Recorded so that turning failing on is one line, and deliberately not
          # turned on yet. A deterministic metric at this threshold fires on any real
          # change, and the action offers no in-repo way to accept a deliberate
          # increase — the series lives on `gh-pages`, not in a file a pull request
          # can edit beside the change that moves it. Flip it once the series has
          # enough points to show it is stable. `verification-gaps/09` owns whether
          # this workflow blocks a merge at all; this series stays out of that.
          fail-threshold: '125%'
          fail-on-alert: false
          summary-always: true

  # Measures pull requests and manual branch runs against the last point stored by main.
  # It reads the series and never writes it: no token, no push, no stored result.
  pull-request:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: bench-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Both jobs below build the same tree under the same profile, and only
          # one of them ever runs. Without a shared key each gets a cache of its
          # own keyed on the job id, so the same bytes are stored twice.
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `orcvs` depends on `midir`, which links ALSA on Linux. Without this the bench
      # jobs fail while building `alsa-sys` and publish nothing.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      # `mise run bench` needs only cargo, which the toolchain step provides. Without
      # this, mise builds cargo-nextest, cargo-deny, trunk, and wasm-pack from source:
      # ten minutes for tools this job never invokes.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Warm up
        run: mise run bench > /dev/null
      - name: Run benchmarks
        # `shell: bash` supplies `pipefail`. The default `bash -e` reports the exit
        # status of `tee`, so a failed benchmark run would pass this step and publish
        # whatever partial output it had already written.
        shell: bash
        run: mise run bench | tee output.txt
      - name: Compare against main
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: lang
          tool: cargo
          output-file-path: output.txt
          # No github-token: the action reads gh-pages anonymously on a public repo,
          # and comment-on-alert would require one. The comparison and the failure
          # threshold work without it.
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: false
          fail-threshold: '300%'
          fail-on-alert: true
          summary-always: true
      # The allocation counts, taken from the very test functions that assert on them.

          # turned on yet. A deterministic metric at this threshold fires on any real
          # change, and the action offers no in-repo way to accept a deliberate
          # increase — the series lives on `gh-pages`, not in a file a pull request
          # can edit beside the change that moves it. Flip it once the series has
          # enough points to show it is stable. `verification-gaps/09` owns whether
          # this workflow blocks a merge at all; this series stays out of that.
          fail-threshold: '125%'
          fail-on-alert: false
          summary-always: true
      # A named-benchmark floor, beside the ratio gate above rather than inside it.
      # The action only ever compares a run against the previous point stored for
      # `main`, so a deliberately accepted regression re-baselines the series in

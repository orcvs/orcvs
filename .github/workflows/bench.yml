      # `output.txt` the timing comparison above read rather than measuring anything
      # twice. See `.scratch/benchmarks/issues/07-hold-a-named-benchmark-to-a-recorded-floor.md`.
      #
      # The last step of the job, so a floor breach cannot skip the allocation
      # comparison. Its steps gate on the step before them rather than on the job's
      # status, so they would survive a failure here anyway; keeping this step last
      # means nothing depends on that. A pull request that breaches a floor still
      # reports its allocation changes. `scripts/check-tooling-contract.sh` holds it
      # last.
      #
      # `install: false` above keeps this job off mise's slower cargo tools, and
      # `node` is the one tool this step needs that install skipped, so it is
      # installed by name here instead of moving that job-wide setting.
      - name: Install node for the bench floor check
        # The ratio gate above fails this job on a large regression, which would skip
        # this step by default on the very run whose floor breach matters most.
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        run: mise install node
      - name: Check bench floors
        # The ratio gate above fails this job on a large regression, which would skip
        # this step by default on the very run whose floor breach matters most.
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        run: node scripts/check-bench-floors.ts output.txt

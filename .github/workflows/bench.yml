      # comparison's fetch: that step fails the job on a ratio-gate alert, and its
      # outcome cannot say whether it failed after fetching or before it. The
      # comparison runs only on this step's outcome. The checkout comes first for
      # the reason the publishing job gives.
      #
      # `+` forces the update, and here it is required rather than defensive: the
      # timing comparison commits this run's timing point onto the local `gh-pages`
      # even without pushing it, so a plain fetch is refused as non-fast-forward.
      # Forcing drops that unpushed point, which the memory comparison never reads.
      - name: Fetch gh-pages for the memory series
        id: pages
        if: ${{ !cancelled() && steps.memory.outcome == 'success' }}
        run: |
          git checkout --quiet --force --detach "$GITHUB_SHA"
          git fetch origin +gh-pages:gh-pages
      - name: Compare allocations against main
        if: ${{ !cancelled() && steps.pages.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: memory
          tool: customSmallerIsBetter
          output-file-path: memory.json
          # No github-token and no push, for the reason the timing comparison above
          # gives: this job reads the series and never writes it.
          auto-push: false
          # "Fetch gh-pages for the memory series" has just brought the local branch
          # level with the remote, and this step runs only when that fetch succeeded.

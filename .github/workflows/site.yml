name: Site

# Builds the site with the console at `/play/` and tests it in Chromium
# (`mise run site_build`, `mise run site_test`). Cloudflare's GitHub integration
# deploys it, from its own build of the same `site/build.sh`. Path-filtered to what the composed
# output is built from: the site, the console and the crates under it, the
# toolchain and tool pins, and the repository docs the site renders. A pull
# request that changes none of them cannot change the site.
#
# Repeated under both triggers because Actions does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  site:
    # A release WASM build, the Astro build and a few dozen browser tests: a
    # few minutes warm. The bound is generous against that and cheap against a
    # browser that never answers.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run site_build
      - name: Install Chromium for the smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium
      - run: mise run site_test


name: Site

# Tests the site. Cloudflare builds and deploys it through its GitHub app: it
# installs the dependencies and runs `npm run build` in `site/`. This workflow
# does the same through `mise run site_build`, which is exactly those two
# commands, runs the Playwright suite against the result, and deploys nothing. The console is the
# one its commit builds: the `console-web` workflow's build for the same commit, or, when that run
# found the console already published, the archive under the commit's console key, as Cloudflare's
# build takes it. Path-filtered to what the site itself is built from: the site, the tool pins, and
# the repository docs it renders, and to the console key and the workflow that publishes it, which
# the console script's test covers.
#
# Repeated under both triggers because Actions does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - 'scripts/console-key.sh'
      - '.github/workflows/console-web.yml'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - 'scripts/console-key.sh'
      - '.github/workflows/console-web.yml'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The Astro build takes a minute or two; the bound also covers waiting for
    # a console build from the same commit, which `console-web` bounds at 20.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: read # find and download the console-web artifact
    steps:
      # The pull request's head, as Cloudflare's preview builds it, rather than its merge with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # The console this commit builds, waiting for its Console web run to finish: that run's build,
      # or the published archive under the commit's key when the run found it already published.
      # Without a run, the build's `prebuild` step downloads the rolling console.
      - name: Download this commit's web console
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          run=$(gh run list --workflow console-web.yml --commit "$HEAD_SHA" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "Console from the rolling console-web release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run watch "$run" --exit-status > /dev/null
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts" \
            --jq '.artifacts[] | select(.name == "console-web") | .name')
          if [[ -n "$artifact" ]]; then
            gh run download "$run" --name console-web --dir target/console-web
            echo "Console from run $run." >> "$GITHUB_STEP_SUMMARY"
          else
            # The run built nothing because the commit's key was already published.
            key="$(bash scripts/console-key.sh)"
            mkdir -p target/console-web
            archive="console-web-$key.tar.gz"
            if ! gh release download console-web --pattern "$archive" --dir target; then
              archive="console-preview-$key.tar.gz"
              if ! gh release download console-web --pattern "$archive" --dir target; then
                echo "Run $run built no console, and console key $key is not on the console-web release." >&2
                exit 1
              fi
            fi
            tar -xzf "target/$archive" -C target/console-web
            echo "Console $archive from the console-web release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "CONSOLE_WEB=$GITHUB_WORKSPACE/target/console-web" >> "$GITHUB_ENV"
      # How Cloudflare's build takes its console, against a stubbed release.
      - run: bash site/scripts/tests/console.sh
      - run: mise run site_build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: site/dist
          if-no-files-found: error

  test:
    needs: build
    # A dozen-odd browser tests against the built artifact. The bound is
    # generous against that and cheap against a browser that never answers.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # The same commit the build job built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-${{ github.sha }}
          path: site/dist
      - name: Install the test dependencies and Chromium
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: mise run site_test

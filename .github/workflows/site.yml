name: Site

# Builds the site with the console at `/play/`, tests it in Chromium
# (`mise run site_build`, `mise run site_test`), and deploys it to Cloudflare: a
# push to `main` deploys, and a pull request uploads a preview. Path-filtered to what the composed
# output is built from: the site, the console and the crates under it, the
# toolchain and tool pins, and the repository docs the site renders. A pull
# request that changes none of them cannot change the site.
#
# Repeated under both triggers because Actions does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'

permissions:
  contents: read

# Keyed on the ref so pushes to `main` deploy one at a time, newest last.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  site:
    # A release WASM build, the Astro build, a dozen browser tests and an
    # upload: a few minutes warm. The bound is generous against that and cheap against a
    # browser that never answers.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # the preview step comments its URL on the pull request

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run site_build
      - name: Install Chromium for the smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium
      - run: mise run site_test

      # The Cloudflare steps skip until the repository has the
      # CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable, and
      # on pull requests from forks, which get no secrets. The token needs only
      # the account's Workers Scripts Edit permission. Wrangler is pinned here
      # rather than in `site/package.json` so the build and tests do not
      # install it.
      - name: Check for Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.149.0 deploy
      - name: Upload a preview to Cloudflare
        id: preview
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@4.149.0 versions upload --preview-alias "pr-$PR_NUMBER" | tee upload.log
          url=$(grep -o 'https://pr-[^ ]*' upload.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview of this pull request: ${url:-see the upload log}" >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, edited on each upload, so the URL stays
      # findable without a comment per push.
      - name: Post the preview URL on the pull request
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Site preview: $PREVIEW_URL"
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" || gh pr comment "$PR_NUMBER" --body "$body"

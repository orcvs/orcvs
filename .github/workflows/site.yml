name: Site

# Tests the site. Cloudflare builds and deploys it, through its GitHub app, by
# running `site/build.sh`; this workflow runs the same script and the
# Playwright suite against the result, and deploys nothing. The console comes
# from the `console-web` workflow's build for the same commit when that commit
# changed the console, and otherwise from the published `console-web` release,
# as Cloudflare's build takes it. Path-filtered to what the site itself is
# built from: the site, the tool pins, and the repository docs it renders.
#
# Repeated under both triggers because Actions does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'mise.toml'
      - 'docs/first-result.md'
      - 'docs/functions.md'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The Astro build takes a minute or two; the bound also covers waiting for
    # a console build from the same commit, which `console-web` bounds at 20.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: read # find and download the console-web artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # The console built from this commit when this commit changed it, waiting
      # for that build to finish. Otherwise `site/build.sh` downloads the
      # published console, as Cloudflare's build does.
      - name: Download this commit's web console
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          run=$(gh run list --workflow console-web.yml --commit "$HEAD_SHA" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "Console from the console-web release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run watch "$run" --exit-status > /dev/null
          gh run download "$run" --name console-web --dir target/console-web
          echo "CONSOLE_WEB=target/console-web" >> "$GITHUB_ENV"
          echo "Console from run $run." >> "$GITHUB_STEP_SUMMARY"
      - run: mise run site_build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: site/dist
          if-no-files-found: error

  test:
    needs: build
    # A dozen-odd browser tests against the built artifact. The bound is
    # generous against that and cheap against a browser that never answers.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-${{ github.sha }}
          path: site/dist
      - name: Install the test dependencies and Chromium
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: mise run site_test

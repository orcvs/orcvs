name: Console web

# Builds the release web console once (`mise run console_web_build`) and keeps
# it as the `console-web` artifact. Its URLs are relative, so the same build
# serves from any path: the site's `/play/`, or a download. On `main` the build
# is also published on the `console-web` release, which is public and never
# expires, as `console-web-<key>.tar.gz` under its console key and as the
# rolling `console-web.tar.gz`. Cloudflare's production build of the site
# (`npm run build` in `site/`) waits for its own commit's key and never compiles
# the console (ADR 0093).
# Path-filtered to what the console is compiled from: the console, the crates
# under it, the Built-in Synth staged beside it, the shipped examples it
# embeds, and the toolchain and tool pins.
# `scripts/console-key.sh` reads this filter, so a path added here is in the key.
#
# Repeated under both triggers because Actions does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'synth/**'
      - 'examples/**'
      - 'scripts/stage-synth.sh'
      - 'scripts/console-key.sh'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - '.github/workflows/console-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'console/**'
      - 'orcvs/**'
      - 'lang/**'
      - 'synth/**'
      - 'examples/**'
      - 'scripts/stage-synth.sh'
      - 'scripts/console-key.sh'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - '.github/workflows/console-web.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One release WASM build with wasm-opt: a few minutes warm.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run console_web_build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-web
          path: target/console-web
          if-no-files-found: error

  # Publishes a console built on `main` under its console key, where the site's
  # production build waits for it. Each key names one archive, so concurrent
  # runs cannot overwrite each other's console and need no queue.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the console-web release and upload to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: console-web
          path: target/console-web
      - name: Publish the console under its key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key="$(bash scripts/console-key.sh)"
          tar -czf "console-web-$key.tar.gz" -C target/console-web .
          if ! gh release view console-web > /dev/null 2>&1; then
            gh release create console-web --prerelease --target "$GITHUB_SHA" \
              --title "Web console (latest main)" --notes "The web consoles built on main."
          fi
          gh release upload console-web "console-web-$key.tar.gz" --clobber
          echo "Published console key $key." >> "$GITHUB_STEP_SUMMARY"

  # Points the rolling console that previews and local builds take at the
  # console of `main`'s tip, and keeps the newest 20 keyed archives. Runs finish
  # out of commit order, and a queued run can displace another, so every run
  # copies `main`'s keyed archive rather than its own build: whichever run goes
  # last leaves the rolling console matching `main`.
  latest:
    needs: publish
    timeout-minutes: 5
    runs-on: ubuntu-latest
    concurrency:
      group: console-web-latest
      cancel-in-progress: false
    permissions:
      contents: write # replace and delete console-web release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Point the rolling console at main and prune old keys
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key="$(bash scripts/console-key.sh)"
          if ! gh release download console-web --pattern "console-web-$key.tar.gz" --output console-web.tar.gz; then
            echo "main's console (key $key) is not published yet; its own run updates the rolling console." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release edit console-web \
            --notes "The web console of main (key $key), and the consoles of recent keys. The site's build downloads its console from here."
          gh release upload console-web console-web.tar.gz --clobber
          gh release view console-web --json assets \
            --jq '.assets | map(select(.name | startswith("console-web-"))) | sort_by(.createdAt) | reverse | .[20:][].name' \
            | while read -r name; do gh release delete-asset console-web "$name" --yes; done

name: Claude review

# Asks Claude for a code review of a pull request through the shared workflow in
# cipherstash/workflows, which decides whether an event is a review request from
# a team member and, if it is, fires the code-review routine for that pull
# request. The rules live in the shared workflow, pinned below by commit; its
# README states them in full. In short, a review is requested when:
#
# - a non-draft pull request is opened or reopened, or a draft is marked ready
#   for review, and its author is a team member;
# - a team member comments on a pull request with a first line starting
#   `@cipherstash-agent review` (drafts and forks too); the rest of the comment
#   is passed on as instructions, and the comment gets a 👀 once the request is
#   sent;
# - a team member requests a review from cipherstash-agent in the Reviewers box.
#
# Pushes to an open pull request do not request a review. Bots' pull requests,
# Dependabot's included, are skipped. Comments run this file from the default
# branch, so the comment command works only once this file is on `main`.
#
# Not a required status context. The review arrives as comments from the
# routine's session, and a failed request shows as an error in the run while the
# check stays green.
#
# Needs, as organisation or repository settings:
#   secret CLAUDE_ROUTINE_TOKEN           the code-review routine's bearer token
#   secret CLAUDE_REVIEW_APP_ID           the membership GitHub App's id
#   secret CLAUDE_REVIEW_APP_PRIVATE_KEY  the membership GitHub App's private key
# The membership App is installed on the orcvs organisation with only
# "Members: read"; the team it checks is the shared workflow's default,
# `developers`.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  # zizmor flags issue_comment because anyone who can comment can start this
  # workflow. Accepted: the shared workflow acts only on a comment command from a
  # team member, checked by its decide job, and never runs code from the pull
  # request.
  issue_comment: # zizmor: ignore[dangerous-triggers] only a team member's comment command is acted on
    types: [created]

permissions: {}

jobs:
  review:
    # Saves starting runners for comments that cannot be a comment command and
    # for review requests aimed at someone else; the shared workflow still checks
    # every rule itself. The mention must match the shared workflow's
    # `review-agent` input. There is no filter on the commenter's
    # author_association: GitHub reports a member whose organisation membership
    # is private as CONTRIBUTOR or NONE, so such a filter would silently drop
    # their commands. The team membership check is the gate.
    if: >-
      (github.event_name != 'issue_comment' || (
      github.event.issue.pull_request
      && contains(github.event.comment.body, '@cipherstash-agent')
      ))
      && (github.event.action != 'review_requested' || github.event.requested_reviewer.login == 'cipherstash-agent')
    # The shared workflow's jobs can hold no more than this. Only its reaction
    # job uses it, to add 👀 to a comment command; its other jobs hold none.
    permissions:
      issues: write
    uses: cipherstash/workflows/.github/workflows/claude-review.yml@386ac4e3cb2458933d3a377a6292478c2cbd2f9f # main
    with:
      routine-trigger-id: trig_01DVcmTPJ9yJwRYLoDjPuV3B
    secrets:
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
      CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
      CLAUDE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

name: Claude review

# Asks Claude for a code review of a pull request through the shared workflow in
# tobyhede/workflows, which decides whether an event is a review request from
# the repository's owner and, if it is, fires the code-review routine for that
# pull request. The rules live in the shared workflow, pinned below by commit;
# its README states them in full. In short, a review is requested when:
#
# - a non-draft pull request is opened or reopened, or a draft is marked ready
#   for review, and its author is the repository's owner;
# - the owner comments on a pull request with a first line starting
#   `> orb ponder` (drafts and forks too); the rest of the comment is passed on
#   as instructions, and the comment gets a 👀 once the request is sent.
#
# The owner is `repository.owner.login` as the event names it. Pushes to an open
# pull request do not request a review, and bots' pull requests, Dependabot's
# included, are skipped. Comments run this file from the default branch, so the
# comment command works only once this file is on `main`.
#
# Not a required status context. The review arrives as comments from the
# routine's session, and a failed request shows as an error in the run while the
# check stays green.
#
# Needs, as a repository setting:
#   secret CLAUDE_ROUTINE_TOKEN  the code-review routine's bearer token
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # zizmor flags issue_comment because anyone who can comment can start this
  # workflow. Accepted: the shared workflow acts only on a comment command from
  # the repository's owner, checked by its decide job, and never runs code from
  # the pull request.
  issue_comment: # zizmor: ignore[dangerous-triggers] only the owner's comment command is acted on
    types: [created]

permissions: {}

jobs:
  review:
    # Saves starting runners for comments that cannot be a comment command: only
    # comments on pull requests that start with `>` and contain `orb` go on. The
    # shared workflow still checks every rule itself; its owner check is the
    # gate. pull_request events are not filtered.
    if: >-
      github.event_name != 'issue_comment' || (
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '>')
      && contains(github.event.comment.body, 'orb')
      )
    # The shared workflow's jobs can hold no more than this. Only its reaction
    # job uses it, to add 👀 to a comment command; its other jobs hold none.
    permissions:
      issues: write
    uses: tobyhede/workflows/.github/workflows/claude-review.yml@36d5e4d8f64eedd4a5321eba6355b9b28777fe8e # main
    with:
      routine-trigger-id: trig_01DVcmTPJ9yJwRYLoDjPuV3B
    secrets:
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}

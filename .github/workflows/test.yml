name: Rust

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request's runs supersede each other; a commit on `main` has nothing to
  # supersede it. The group interpolated the pull request number, which is empty
  # on a push, so every push to `main` collapsed into one group and a later merge
  # cancelled an earlier commit's run — reported as `cancelled` rather than
  # `failure`, so nothing alerted. Keying a push on its own commit gives each
  # commit a group of its own, and cancellation is confined to pull requests.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Decides whether this run compiles. A pull request whose diff is Markdown
    # alone cannot change what cargo builds or tests, so it runs the contract and
    # the roadmap planner and skips the rest; every other event compiles. See
    # `scripts/ci-compile-needed.sh`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.decide.outputs.compile }}
    steps:
      # Depth two so the pull request's merge commit has its base as first parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: decide
        env:
          CI_EVENT: ${{ github.event_name }}
        run: |
          bash scripts/ci-compile-needed.sh >> "$GITHUB_OUTPUT"

  full-gate:
    # Warm, this job finishes in about ninety seconds: it restores `main`'s cache
    # through the key prefix and compiles almost nothing. The first run after a
    # dependency lands is the exception — PR #104 added sixty-four crates
    # (accesskit, kittest, and on Linux the atspi/zbus tree) that `main`'s cache
    # did not hold, and they compile once here before `main` saves them. Minutes,
    # against a bound of twenty. Unbounded, a job that hangs — `wasm-pack test
    # --headless --firefox` waiting on a browser that never answers is the obvious
    # candidate — holds a runner for the six-hour limit instead. The bound is
    # generous against the real cost and cheap against that.
    timeout-minutes: 20
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      # A cache saved on a pull request's ref can only ever be read back by that
      # same pull request, so saving there fills the repository's shared quota
      # with entries nobody reads and evicts the ones on `main` that every run
      # restores from. Restoring is unaffected: a pull request still reads
      # `main`'s cache through the key prefix.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.compile == 'true'
        run: mise run check_pull_request
      - if: needs.changes.outputs.compile != 'true'
        run: mise run check_docs
      - if: github.event_name != 'pull_request'
        env:
          ORCVS_MERGE_COMPONENT: native
        run: mise run check_merge

  macos:
    # Deferred off pull requests: development happens on macOS, so a clean-runner
    # check of it belongs at merge queue verification, pushes to `main`, and
    # manual dispatch rather than on every push to a branch.
    if: github.event_name != 'pull_request'
    # Forty rather than the twenty every other job takes. This tier compiles the
    # workspace twice — default features and `--no-default-features` — since
    # `console` ships `persistence` on and the feature-off build is a separate
    # feature set, so it shares nothing with the default one. The caches here
    # only ever save on `main` (`save-if` and `cache_save` below), so a run
    # restores whatever `main` last wrote and pays in full for whatever it does
    # not hold, on the slowest runner of the three.
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check_pull_request
      # Plays a Source through the console's MIDI backend into a virtual input
      # port and cross-checks what the listener received against what was sent.
      # Here because CoreMIDI offers virtual ports with no setup; the hosted
      # Ubuntu runner's Azure kernel ships no ALSA sequencer module.
      - run: mise run test_midi_loopback

  wasm:
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check_wasm
      - if: github.event_name != 'pull_request'
        env:
          ORCVS_MERGE_COMPONENT: wasm
        run: mise run check_merge

  ci:
    # Required on both PRs and merge groups, including when a dependency fails.
    if: always()
    needs: [changes, full-gate, macos, wasm]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the checks for this event
        env:
          CI_EVENT: ${{ github.event_name }}
          COMPILE: ${{ needs.changes.outputs.compile }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINUX_RESULT: ${{ needs.full-gate.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
        run: bash scripts/check-ci-results.sh

name: Rust

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request's runs supersede each other; a commit on `main` has nothing to
  # supersede it. The group interpolated the pull request number, which is empty
  # on a push, so every push to `main` collapsed into one group and a later merge
  # cancelled an earlier commit's run — reported as `cancelled` rather than
  # `failure`, so nothing alerted. Keying a push on its own commit gives each
  # commit a group of its own, and cancellation is confined to pull requests.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  full-gate:
    # Every job here finishes in about ninety seconds. Unbounded, one that hangs —
    # `wasm-pack test --headless --firefox` waiting on a browser that never
    # answers is the obvious candidate — holds a runner for the six-hour limit
    # instead. The bound is generous against the real cost and cheap against that.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      # A cache saved on a pull request's ref can only ever be read back by that
      # same pull request, so saving there fills the repository's shared quota
      # with entries nobody reads and evicts the ones on `main` that every run
      # restores from. Restoring is unaffected: a pull request still reads
      # `main`'s cache through the key prefix.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check_pull_request
      - if: github.event_name != 'pull_request'
        env:
          ORCVS_MERGE_COMPONENT: native
        run: mise run check_merge

  macos:
    # Deferred off pull requests: development happens on macOS, so a clean-runner
    # check of it belongs at merge queue verification, pushes to `main`, and
    # manual dispatch rather than on every push to a branch.
    if: github.event_name != 'pull_request'
    # Forty rather than the twenty every other job takes. This tier compiles the
    # workspace twice — default features and `--no-default-features` — since
    # `console` ships `persistence` on and the feature-off build is a separate
    # feature set, so it shares nothing with the default one. The caches here
    # only ever save on `main` (`save-if` and `cache_save` below), so a run
    # restores whatever `main` last wrote and pays in full for whatever it does
    # not hold, on the slowest runner of the three.
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check_pull_request

  wasm:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check_wasm
      - if: github.event_name != 'pull_request'
        env:
          ORCVS_MERGE_COMPONENT: wasm
        run: mise run check_merge

  ci:
    # Required on both PRs and merge groups, including when a dependency fails.
    if: always()
    needs: [full-gate, macos, wasm]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the checks for this event
        env:
          CI_EVENT: ${{ github.event_name }}
          LINUX_RESULT: ${{ needs.full-gate.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
        run: bash scripts/check-ci-results.sh

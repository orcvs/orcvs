name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.137,cargo-deny@0.20.2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --package console --all-targets --features persistence --locked -- -D warnings
      - run: cargo nextest run --workspace --profile ci --locked
      - run: cargo nextest run --package console --all-targets --features persistence --profile ci --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --package console --doc --features persistence --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --package console --no-deps --features persistence --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - run: cargo check --package console --lib --target wasm32-unknown-unknown --features persistence --locked
      - run: trunk build --locked
        working-directory: console

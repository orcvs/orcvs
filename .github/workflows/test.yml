name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - console/**
      - lang/**
      - .github/workflows/test.yml
      - "!**/benches/**"
  pull_request:
    branches:
      - main
    paths:
      - console/**
      - lang/**
      - .github/workflows/test.yml
      - "!**/benches/**"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --profile ci --workspace

      - name: Build persistence feature
        run: cargo build --profile ci --package console --features persistence

      - name: Clippy
        run: cargo clippy --workspace --no-deps --tests


  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --profile ci --workspace

      - name: lang
        run: cargo nextest run --package lang --no-fail-fast

      - name: console
        run: cargo nextest run --package console --no-fail-fast

    <figure><figcaption>C + area <span>Changing edges + field</span></figcaption><canvas data-treatment="area" role="img" aria-label="Continuously changing white cursor and green noise field; click to move the cursor"></canvas></figure>
  </div>
  <div class="position" aria-live="polite">Cell 17, 11 · click grid or use arrows</div>
</div>
<script>
(()=>{
const root=document.getElementById('orcvs-evolving-frame');
const canvases=[...root.querySelectorAll('canvas')];
let zoom=1,selected={x:17,y:11},seed=Math.floor(Math.random()*4294967296),pattern=1;
let frameSeed=seed,areaSeed=seed,burstStart=-Infinity,animation=0,glitch=0,noiseTick=0;
let live=true;
let areaTime=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
live=!reducedMotion.matches;
root.querySelector('[data-live]').setAttribute('aria-pressed',String(live));
root.querySelector('[data-live]').textContent=live?'Pause motion':'Animate';
const palette={source:'#070d0d',ordinary:'#a5b7b2',number:'#83a6d8',function:'#68e0b8',note:'#aa91d6',bang:'#ff7f87',comment:'#7a8784'};
const source=new Map();
function put(x,y,text,colour){[...text].forEach((char,i)=>source.set(`${x+i},${y}`,{char,colour}));}
// Source is a visual fixture, not a playback demonstration.
put(12,8,'|| sequence',palette.comment);
put(12,10,'*',palette.bang);put(14,10,'C',palette.function);put(15,10,'4',palette.number);
put(16,11,'D',palette.function);put(17,11,'4',palette.number);put(18,11,'8',palette.number);
put(14,13,':',palette.function);put(15,13,'04',palette.number);put(17,13,'C',palette.note);put(18,13,'4',palette.number);
put(22,10,'*',palette.bang);put(23,11,'F',palette.function);put(24,11,'08',palette.number);
put(23,13,':',palette.function);put(24,13,'02',palette.number);put(26,13,'G',palette.note);
function hash(x,y){let h=(Math.imul(x,0x9e3779b1)^Math.imul(y,0x85ebca77))>>>0;h^=h>>>16;h=Math.imul(h,0xc2b2ae3d)>>>0;h^=h>>>13;return h>>>0;}
function noise(n){return hash(n+103,areaSeed)/4294967295;}
function cursorNoise(n){return hash(n+103,frameSeed)/4294967295;}
function line(ctx,x,y,xx,yy,width,alpha=1){ctx.strokeStyle=`rgba(234,235,229,${alpha})`;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();}
function strip(ctx,x,y,w,h,a=1){ctx.fillStyle=`rgba(234,235,229,${a})`;ctx.fillRect(x,y,w,h);}
function treatment(ctx,kind){
 // Local dimensions stay in Source points; grid and effect zoom together.
 if(kind==='brackets'){
  line(ctx,0,8,0,0,1.25);line(ctx,0,0,8,0,1.25);
  line(ctx,17,0,24,0,0.8,.8);line(ctx,24,0,24,5,0.8,.8);
  line(ctx,24,15,24,24,1.4);line(ctx,24,24,15,24,1.4);
  line(ctx,0,18,0,24,0.8,.65);line(ctx,0,24,5,24,0.8,.65);
  strip(ctx,-5,5,7,.7,.7);strip(ctx,21,18,10,.65,.65);
  strip(ctx,27,18,7,.65,.2);strip(ctx,9,-2,3,.7,.25);
  strip(ctx,-2,26,6,.5,.23);strip(ctx,20,24,2,1.5,1);
 }else if(kind==='block'){
  // Irregular bands leave a strong block silhouette and an open right edge.
  [[0,0,24,2],[0,3,23,3],[-2,7,26,2],[1,10,23,4],[0,15,24,3],[-1,19,25,2],[0,22,24,3]].forEach(r=>strip(ctx,...r,.92));
  strip(ctx,-7,7,4,.8,.5);strip(ctx,22,3,9,.7,.7);strip(ctx,26,19,9,.8,.38);
  strip(ctx,-4,23,3,.6,.25);
 }else if(kind==='frame'||kind==='area'){
  // Every side has independent moving concentrations and gaps. Only the cell
  // bounds are fixed; no permanently bright corner or repeated diagonal motif.
  const point=(side,t,offset=0)=>side===0?[t,offset]:side===1?[24+offset,t]:side===2?[24-t,24+offset]:[-offset,24-t];
  for(let side=0;side<4;side++){
   const base=side*1000;
   const hot=cursorNoise(base+601)*24;
   const hot2=cursorNoise(base+602)*24;
   // Connected but interrupted fragments move around the whole perimeter.
   for(let segment=0;segment<7;segment++){
    const t=cursorNoise(base+610+segment*3)*22;
    if(cursorNoise(base+611+segment*3)<.28)continue;
    const length=1.5+cursorNoise(base+612+segment*3)*6;
    const off=(cursorNoise(base+640+segment)-.5)*1.7;
    const start=point(side,t,off),end=point(side,Math.min(24,t+length),off);
    line(ctx,...start,...end,.5+cursorNoise(base+650+segment)*.65,.35+cursorNoise(base+660+segment)*.55);
   }
   for(let i=0;i<45;i++){
    const n=base+100+i*7,t=cursorNoise(n)*24;
    const density=Math.max(0,1-Math.min(Math.abs(t-hot),Math.abs(t-hot2))/7);
    if(cursorNoise(n+1)>.18+density*.78)continue;
    const off=(cursorNoise(n+2)-.5)*(1.5+density*8);
    const [x,y]=point(side,t,off);
    strip(ctx,x,y,.45+cursorNoise(n+3)*(1+density*5),.4+cursorNoise(n+4)*1.25,.2+cursorNoise(n+5)*.7);
   }
  }
  // Tears and fine connections attach to freshly chosen edge positions.
  for(let tear=0;tear<7;tear++){
   const n=6000+tear*11;
   if(cursorNoise(n)<.2)continue;
   const side=Math.floor(cursorNoise(n+1)*4),t=cursorNoise(n+2)*24;
   const [x,y]=point(side,t);
   const length=3+cursorNoise(n+3)*12;
   const direction=cursorNoise(n+4)<.5?-1:1;
   strip(ctx,x+(direction<0?-length:0),y+(cursorNoise(n+5)-.5)*3,length,.45+cursorNoise(n+6)*.6,.25+cursorNoise(n+7)*.45);
   if(cursorNoise(n+8)>.55){
    const [tipX,tipY]=point(side,Math.min(24,t+2+cursorNoise(n+9)*4),3+cursorNoise(n+10)*5);
    line(ctx,x,y,tipX,tipY,.4,.35);
   }
  }
 }
}
// Smooth spatial noise gives nearby points related values; no cell-level coin flips.
function field(x,y,period,salt){
 const gx=Math.floor(x/period),gy=Math.floor(y/period);
 const u=x/period-gx,v=y/period-gy;
 const sx=u*u*(3-2*u),sy=v*v*(3-2*v);
 const n=(ix,iy)=>hash(ix+salt,iy^areaSeed)/4294967295;
 return (n(gx,gy)*(1-sx)+n(gx+1,gy)*sx)*(1-sy)+(n(gx,gy+1)*(1-sx)+n(gx+1,gy+1)*sx)*sy;
}
function area(ctx){
 const greenStrip=(x,y,w,h,a)=>{ctx.fillStyle=`rgba(76,190,156,${a*1.35})`;ctx.fillRect(x,y,w,h);};
 // Seven-cell reach, irregular connected patches, with large empty areas.
 const strength=(x,y)=>{
  const dx=(x-12)/175,dy=(y-12)/175;
  const envelope=Math.max(0,1-Math.pow(Math.max(Math.abs(dx),Math.abs(dy)),1.35));
  const cloud=field(x+areaTime*5,y-areaTime*2,54,91)*.7+field(x-areaTime*3,y+areaTime*4,19,127)*.3;
  return Math.max(0,(cloud-.32)/.68)*envelope;
 };
 for(let y=-162;y<187;y+=2)for(let x=-162;x<187;x+=2){
  const density=strength(x,y);
  const grain=.45+hash(x+noiseTick*3,y^areaSeed)/4294967295*.55;
  greenStrip(x,y,2,2,density*grain*.14);
 }
 for(let i=0;i<290;i++){
  const x=-158+noise(1000+i*4)*338,y=-158+noise(1001+i*4)*338;
  if(hash(i,Math.floor(noiseTick/2))%5===0)continue;
  const density=strength(x,y);
  if(density<.13||noise(3000+i)>density*1.9)continue;
  const length=1+Math.pow(noise(1002+i*4),3)*28*(.65+.7*hash(i,noiseTick)/4294967295);
  greenStrip(x,y,length,.4+noise(1003+i*4)*.65,density*(.12+noise(4000+i)*.45));
  if(i%9===0){ctx.strokeStyle=`rgba(76,190,156,${density*.3})`;ctx.lineWidth=.45;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+length*.4,y-2-noise(5000+i)*7);ctx.stroke();}
 }
}
function draw(canvas){
 const width=canvas.clientWidth,height=350,dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle=palette.source;ctx.fillRect(0,0,width,height);
 const cell=25*zoom,cx=width/2-12.5*zoom,cy=height/2-12.5*zoom;
 const ox=cx-17*cell,oy=cy-11*cell;
 canvas.dataset.originX=ox;canvas.dataset.originY=oy;
 const startX=Math.max(0,Math.floor(-ox/cell)),endX=Math.ceil((width-ox)/cell);
 const startY=Math.max(0,Math.floor(-oy/cell)),endY=Math.ceil((height-oy)/cell);
 const kind=canvas.dataset.treatment;
 if(kind==='area'){ctx.save();ctx.translate(ox+selected.x*cell,oy+selected.y*cell);ctx.scale(zoom,zoom);area(ctx);ctx.restore();}
 for(let y=startY;y<endY;y++)for(let x=startX;x<endX;x++){
  const px=ox+x*cell,py=oy+y*cell,active=x===selected.x&&y===selected.y;
  let border='rgba(29,55,49,.282)',fill=null;
  if(kind==='current'){
   let d=Math.max(Math.abs(x-selected.x),Math.abs(y-selected.y));
   d+=(d===7?hash(x,y)%3!==0:hash(x,y)%2===0)?1:0;
   const band=d<=1?0:d<=2?1:d<=4?2:d<=7?3:-1;
   if(band>=0){fill=['#0a1e1a','#091a17','#081614','#081211'][band];border=['rgba(76,190,156,.588)','rgba(58,148,122,.49)','rgba(43,110,92,.392)','rgba(34,78,67,.322)'][band];}
   if(active){fill='#0a2a22';border='#52c3a3';}
  }
  if(fill){ctx.fillStyle=fill;ctx.fillRect(px,py,cell,cell);}
  ctx.strokeStyle=border;ctx.lineWidth=.5*zoom;ctx.strokeRect(px+.25*zoom,py+.25*zoom,cell-.5*zoom,cell-.5*zoom);
  for(const left of [true,false]){
   const axis=left?x:y,offset=(left?y:x)%8;
   if(axis<=0||axis%8!==0||active)continue;
   const band=Math.min(Math.min(offset,7-offset),3);
   if(band>=2&&hash(x,y)%4===0)continue;
   ctx.strokeStyle=`rgba(55,101,86,${.431*[1,.72,.34,.13][band]})`;ctx.lineWidth=.75*zoom;
   ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(left?px:px+cell,left?py+cell:py);ctx.stroke();
  }
 }
 if(kind!=='current'){
  ctx.save();ctx.translate(ox+selected.x*cell+.5*zoom,oy+selected.y*cell+.5*zoom);ctx.scale(zoom,zoom);
  if(glitch>0){
   for(let band=0;band<3;band++){
    ctx.save();ctx.beginPath();ctx.rect(-20,-14+band*18,64,18);ctx.clip();
    ctx.translate((cursorNoise(800+band)-.5)*9*glitch,0);treatment(ctx,kind);ctx.restore();
   }
  }else treatment(ctx,kind);
  ctx.restore();
 }
 ctx.font=`${18*zoom}px OrcvsPreview, monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let y=startY;y<endY;y++)for(let x=startX;x<endX;x++){
  const token=source.get(`${x},${y}`);if(!token)continue;
  ctx.fillStyle=kind==='block'&&x===selected.x&&y===selected.y?palette.source:token.colour;
  ctx.fillText(token.char,ox+(x+.5)*cell,oy+(y+.5)*cell+.5*zoom);
 }
}
function render(){
 const elapsed=performance.now()-burstStart;
 const moving=elapsed<200;
 glitch=live?(moving?.9:.25+hash(noiseTick,seed)%100/250):0;
 frameSeed=hash(seed,noiseTick);
 canvases.forEach(draw);
 const label=`Cell ${selected.x}, ${selected.y} · ${live?'live noise':'paused'} · click grid or use arrows`;
 const status=root.querySelector('.position');
 if(status.textContent!==label)status.textContent=label;
}
function tick(){
 if(!live)return;
 noiseTick++;areaTime+=.16;
 render();
 // Uneven timing and local grain changes avoid a synchronized on/off pulse.
 animation=setTimeout(tick,100+hash(noiseTick,seed)%120);
}
function burst(){
 seed=Math.floor(Math.random()*4294967296);areaSeed=seed;pattern++;noiseTick++;burstStart=performance.now();
 render();
}
function move(dx,dy){selected={x:Math.max(0,selected.x+dx),y:Math.max(0,selected.y+dy)};burst();}
root.querySelectorAll('[data-scale]').forEach(button=>button.addEventListener('click',()=>{
 zoom=Number(button.dataset.scale);root.querySelectorAll('[data-scale]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();
}));
root.querySelector('[data-live]').addEventListener('click',()=>{
 live=!live;clearTimeout(animation);
 const button=root.querySelector('[data-live]');button.textContent=live?'Pause motion':'Animate';button.setAttribute('aria-pressed',String(live));
 if(live)tick();else render();
});
root.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',()=>move(...button.dataset.move.split(',').map(Number))));
root.addEventListener('keydown',event=>{
 const direction={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[event.key];
 if(direction){event.preventDefault();move(...direction);}
});
canvases.forEach(canvas=>canvas.addEventListener('click',event=>{
 const r=canvas.getBoundingClientRect();selected={x:Math.max(0,Math.floor((event.clientX-r.left-Number(canvas.dataset.originX))/(25*zoom))),y:Math.max(0,Math.floor((event.clientY-r.top-Number(canvas.dataset.originY))/(25*zoom)))};
 root.querySelector('[data-live]').focus({preventScroll:true});burst();
}));
new ResizeObserver(render).observe(root);
render();document.fonts.load('18px OrcvsPreview').then(render);
if(live)animation=setTimeout(tick,140);
})();
</script>

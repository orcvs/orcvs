[package]
name = "console"
version = "0.1.0"
authors = []
edition.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "console"
path = "src/lib.rs"

[[bin]]
name = "console"
path = "src/main.rs"

[features]
# Persistence ships on. `product-persistence/01` requires the *shipped*
# application to save the current Source revision and restore it on the next
# start, and a feature that ships off is only ever proved in a configuration
# nobody launches: `mise run run`, `cargo run`, the `.vscode` cargo tasks, and a
# `trunk build` all take the default set. Enabling it by default costs the
# default binary `eframe/persistence` and `serde` in `orcvs`, both already in the
# locked graph, and no runtime work beyond the storage read at start and the
# write eframe schedules.
#
# The feature stays declared rather than being inlined, because the path must
# still be compilable out — that is this ticket's own acceptance criterion. What
# proves it is now `--no-default-features`, which is the arm every verification
# tier runs beside the default one. See docs/tooling.md.
default = ["persistence"]
persistence = ["eframe/persistence", "orcvs/persistence"]

[dependencies]
# Defaults off here and `native-midi` back on in the non-WASM table below, so
# the shipped console's MIDI is the console's own declaration rather than a
# borrowed default: `orcvs` could stop defaulting the feature on and the
# application would still list and select destinations. The browser build asks
# for no native backend at all, which is what it already got.
orcvs = { path = "../orcvs", version = "0.1.0", default-features = false }
# Keep both Linux window backends explicit because disabling eframe defaults removes them.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.1", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "std",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orcvs = { path = "../orcvs", version = "0.1.0", default-features = false, features = ["native-midi"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-test = "0.3"

[dev-dependencies]
lang = { path = "../lang", version = "0.1.0" }


[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]


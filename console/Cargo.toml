[package]
name = "console"
version = "0.1.0"
authors = []
edition.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "console"
path = "src/lib.rs"

[[bin]]
name = "console"
path = "src/main.rs"

[features]
default = []
persistence = ["dep:serde", "eframe/persistence"]

[dependencies]
lang = { path = "../lang", version = "0.1.0" }
arrayvec.workspace = true
# Keep both Linux window backends explicit because disabling eframe defaults removes them.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.1", default-features = false }
nohash-hasher = "0.2.0"
serde = { version = "1", default-features = false, features = [
    "derive",
], optional = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tokio-util = "0.7.11"
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "std",
] }
web-time = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
midir = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"


[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }


[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]


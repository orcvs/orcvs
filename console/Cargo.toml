[package]
name = "console"
version = "0.1.0"
authors = []
edition.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "console"
path = "src/lib.rs"
# `--benches` selects the library too, and its unit-test harness does not
# understand criterion's arguments.
bench = false

[[bin]]
name = "console"
path = "src/main.rs"
# `--benches` selects every target with `bench = true`. The binary's default
# is that, and its libtest harness rejects `--output-format` the same way
# the library would.
bench = false

[features]
# Persistence ships on. `product-persistence/01` requires the *shipped*
# application to save the current Source revision and restore it on the next
# start, and a feature that ships off is only ever proved in a configuration
# nobody launches: `mise run run`, `cargo run`, the `.vscode` cargo tasks, and a
# `trunk build` all take the default set. Enabling it by default costs the
# default binary `eframe/persistence` and `serde` in `orcvs`, both already in the
# locked graph, and no runtime work beyond the storage read at start and the
# write eframe schedules.
#
# The feature stays declared rather than being inlined, because the path must
# still be compilable out — that is this ticket's own acceptance criterion. What
# proves it is now `--no-default-features`, which is the arm every verification
# tier runs beside the default one. See docs/tooling.md.
default = ["persistence"]
persistence = ["eframe/persistence", "orcvs/persistence"]
# Development-only inspection, off in every shipped build and in every tier's
# default arm. It forwards to `eframe/inspection`, which is upstream's own
# integration: the feature pulls `egui_inspection` in and
# `eframe::maybe_attach_inspection_plugin` attaches the plugin from
# `glow_integration`/`wgpu_integration` at start
# (`eframe-0.36.2/src/lib.rs:214-222`). The console writes no server of its own.
#
# The feature alone changes nothing a viewer can see. `egui_inspection` reads
# `EGUI_INSPECTION` at start and binds nothing when the variable is unset, empty,
# `0` or `false` (`egui_inspection-0.36.2/src/lib.rs:40-50`), so a build carrying
# the feature and launched without the variable behaves exactly like one without
# it. Deliberate activation is the variable, not the build.
#
# Off by default because attaching it hands full control of the running console —
# input injection, the widget tree, and screenshots — to whatever connects, with
# no authentication. `mise run inspect` is the launcher that sets
# `EGUI_INSPECTION` to an explicit loopback host:port; see `docs/tooling.md` and
# `.agents/skills/egui/references/guide.md`.
#
# Native-only in effect rather than by declaration: `eframe` gates the attach on
# `not(target_arch = "wasm32")`, so a browser build that enabled this would still
# start no server. No tier enables it for `wasm32`, and `mise run check_wasm`
# builds the two feature sets it has always built.
inspection = ["eframe/inspection"]
# Test-only: the release captures in `console::kittest_tests::capture`, which render
# the running console to images for a reviewer. It turns on the two
# `egui_kittest` features that render a frame — `wgpu`, the renderer, and
# `snapshot`, which encodes the image as PNG — and `persistence`, the path the
# seeded Source enters through. Both `egui_kittest` features reach the
# dev-dependency only, so no shipped build can carry them. `mise run
# capture_native` runs it, and `.github/workflows/release-captures.yml` runs
# that on manual dispatch alone; `mise run check_release_capture` compiles it,
# without rendering, in the native merge tier and nowhere else, so the capture
# keeps compiling against the helpers it shares with the interaction tests.
# No pull-request gate enables it. `scripts/check-tooling-contract.sh` pins all three.
#
# What it costs, paid only there: `wgpu`, `naga` and `egui-wgpu` (MIT or
# Apache-2.0), `dify` and `colored` 2 behind `snapshot` (`colored` is MPL-2.0 and
# allowed for that crate alone in `deny.toml`), `eframe/wgpu` in the dev graph,
# and second copies of `pollster` and `rustc-hash`, recorded in `deny.toml`.
release-capture = ["persistence", "egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
# Defaults off here; platform MIDI lives in this crate's `console_midi` module.
orcvs = { path = "../orcvs", version = "0.1.0", default-features = false }
# Keep both Linux window backends explicit because disabling eframe defaults removes them.
#
# `=0.36.2` rather than `0.36.2`. A caret requirement reads "0.36.2 or any later
# 0.36", and the console's own reasoning is written against this one release and
# cites its sources: the one-frame `GlyphTable` against `Fonts::begin_pass`
# recreating the font atlas, the web clear colour and the storage key against
# eframe's runners, the repaint tests against `InputState::wants_repaint_after`,
# and the Theme's colour composition against `ecolor` and egui's `Visuals`.
# `grep -rn '0\.36\.2' console/src` lists every such citation. A patch release
# that arrives without anyone deciding to takes those citations out from under
# the code that depends on them, and without an exact pin only the lockfile holds
# the version. Moving the stack is a decision taken on its own, which re-reads
# every citation against the new sources. The pin says what the manifest means.
#
# `.agents/skills/egui/references/guide.md` records the release this stack is
# read against and what moving it costs.
eframe = { version = "=0.36.2", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "=0.36.2", default-features = false }
# The Theme document decoder (`theme_document.rs`, `.scratch/theming/issues/07`).
# A Theme document is TOML and nothing else, as ADR 0053 records: `toml`'s own
# Serde deserializer decodes it straight into a derived, strict document type.
# The `config` crate's intermediate value layer cannot meet that model: it
# converts types, keeps the last duplicate key and drops line and column
# (`schema.md`'s 2026-09-23 comment).
#
# `toml` is also in the locked graph as a dev-only dependency (`egui_kittest`).
# Its defaults are off only to drop `display`, its serializer; decoding needs
# `parse`, `serde` and `std`. `Cargo.lock` still lists
# `indexmap` and `toml_writer` under `toml`, because `std` names them as weak
# `?/std` features, but neither is built (`cargo tree -i toml_writer` is empty).
# `serde` itself is here for `derive` on the document type; it is already in the
# graph through `orcvs/persistence`.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing.workspace = true

[target.'cfg(all(not(target_arch = "wasm32"), any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
midir = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native Open and Save dialogs (`.scratch/menu-structure/issues/07`, `08`).
# egui draws no file dialog and eframe opens none, and a hand-written picker
# inside the console would be a second, worse file browser; `spec.md` chose
# `rfd`, the dialog crate eframe's own examples use.
#
# Synchronous API only: `FileDialog::pick_file` and `save_file` run the
# platform's modal dialog on the UI thread, which is where `Console::ui` asks
# for it, so no executor or `AsyncFileDialog` is involved. Native only, because
# the web defers file I/O (`spec.md`, "Web file I/O is deferred"): `rfd`'s
# `save_file` is unsupported on wasm32, and Open without Save is half a feature.
#
# Defaults are off. They are `xdg-portal` and `wayland`; `wayland` only mints
# the parent-window identifier a dialog is attached to under Wayland, and the
# console passes no parent, so it would add `wayland-backend`, `wayland-client`
# and `wayland-protocols` for nothing. `xdg-portal` is kept because Linux needs a
# backend (`rfd`'s build script refuses none) and it is the one without a system
# library at build time: it `dlopen`s `libdbus-1` at run time and falls back to
# `zenity`, where `gtk3` would link GTK and need its headers in CI. `Cargo.lock`
# gains `rfd` and `pollster` (Linux and the BSDs) and nothing else: the
# `objc2` 0.6 / `objc2-*` 0.3 AppKit and Foundation bindings, `block2`,
# `dispatch2`, `raw-window-handle` and `windows-sys` 0.61 it uses were already
# locked. MIT licensed; `rfd` calls platform APIs through `unsafe`, as any
# dialog crate must.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `main.rs`'s `trace()` is the only shipped user of this crate, and it is
# itself `cfg(not(target_arch = "wasm32"))`-gated, so a WASM build has no code
# path that reaches it. The native persistence tests also install a `fmt`
# subscriber to read what `crate::report` writes. Target-gating the
# dependency keeps it and everything beneath it out of the WASM graph.
#
# `fmt` is declared although `ansi` already implies it, because `main.rs`
# names `FmtSubscriber` and that should not rest on `ansi` staying. There is
# no `env-filter`: nothing here reads a filter — `trace()` sets its level
# directly — and that feature is what pulls `matchers`, `regex-automata` and
# `regex-syntax` in. `orcvs` declares it as a dev-dependency and does use it,
# so the lockfile carries those three either way.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "fmt",
    "std",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Uint8Array`, the buffer `MIDIOutput.send` takes a message in
# (`web_midi.rs`). Already in the locked graph beneath `web-sys` and
# `wasm-bindgen-futures`, at the version they resolve, so no crate enters.
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# The Web MIDI entries are the browser's MIDI backend (`web_midi.rs`), which
# discovery and port opening reach on the main thread: `Navigator` for
# `requestMIDIAccess`, `MidiAccess` and `MidiOutputMap` for enumeration, and
# `MidiOutput`, `MidiPort` and `MidiPortDeviceState` for a port's id, name,
# connection state and `send`. Each is a generated binding in the `web-sys`
# already built for this target, gated by a feature so the unused ones are not
# compiled; none of them adds a dependency. Input ports, `MidiOptions` and the
# connection events are left off: Orcvs sends, does not ask for system
# exclusive, and discovery is something the performer asks for.
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "MidiAccess",
    "MidiOutput",
    "MidiOutputMap",
    "MidiPort",
    "MidiPortDeviceState",
    "Navigator",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The UI interaction tests in `console::kittest_tests` drive the real `Console`
# through `eframe::App` over an AccessKit tree, which is the one thing the
# hand-rolled `app_pass` beside them cannot do: it can post an `egui::Event` at a
# position but it cannot find the menu item a viewer would click.
#
# `eframe` is the only feature enabled, and it is the load-bearing one: it is
# what `Harness::build_eframe` is behind (`egui_kittest-0.36.2/src/builder.rs:208-235`),
# and without it the harness can only be given a closure — a second, test-only
# UI, which this repository's own policy refuses. It pulls `eframe/accesskit`
# with it, so a `cargo test` build of `eframe` carries `accesskit_winit` that a
# `cargo build` does not. That is a dev-graph activation and it is the price of
# querying production widgets by role and label.
#
# `snapshot` and `wgpu` are off here and on only under the `release-capture`
# feature above. Both exist to render a frame to an image, `snapshot` has no
# renderer without `wgpu` (`egui_kittest-0.36.2/src/renderer.rs:36-45`), and
# `wgpu` puts the whole wgpu and naga tree into the graph and a GPU adapter into
# the run. The ordinary test build and every gate but the merge tier's compile
# of the captures do without both: the
# `Shape`-level assertions in `console::tests` hold paint at a finer grain than
# an image can, and nothing compares images against a baseline.
# `.agents/skills/egui/references/guide.md` records where they are on and why.
#
# Confined to the non-WASM target table for the reason `proptest` is: the
# invariants these tests hold are platform-independent, `cargo clippy
# --all-targets --target wasm32-unknown-unknown` compiles this crate's unit tests,
# and a browser build has no business resolving a test harness. `=0.36.2` for the
# reason `egui` and `eframe` carry it — the harness has to be the one that matches
# the egui it drives.
egui_kittest = { version = "=0.36.2", default-features = false, features = ["eframe"] }
# Native FileStorage writes a RON `HashMap<String, String>` to `app.ron`.
# FileStorage itself is crate-private (`from_ron_filepath` is `pub(crate)`;
# only `eframe::storage_dir` is re-exported), so a product-path test has to
# speak that codec to prove the file the native binary writes. Already in the
# locked graph through eframe/persistence. Not a shipped dependency.
ron = "0.12"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-test = "0.3"
# Test-only: `product_path` drives `window.localStorage`, which is the
# shipped WASM backend. The application binary never names this feature.
web-sys = { version = "0.3", features = ["Storage"] }

[dev-dependencies]
# Same pin as `lang` and `orcvs`: already in the locked graph, needed here
# because `Paint::derive` lives in this crate and `source-paint/09` measures it.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
lang = { path = "../lang", version = "0.1.0" }
# `test-grid-shapes` lets the console's tests build a Grid smaller than the one
# 256 by 256 shape, and `test-output-adapter` gives the WASM tests and the paint
# bench an output to drive Playback over (`orcvs/Cargo.toml` states why each
# feature exists). Declared here only, so a `cargo build` of the console never
# enables them; `persistence` still reaches `orcvs` through this crate's own
# feature, not through this line.
orcvs = { path = "../orcvs", version = "0.1.0", default-features = false, features = [
    "test-grid-shapes",
    "test-output-adapter",
] }
# ADR 0041 makes the Playback Engine a task, so building a running Orcvs needs a
# runtime to spawn it on and every test that builds one needs `#[tokio::test]`.
# Declared for every target rather than beside the non-WASM dependency table:
# the unit tests are compiled for `wasm32-unknown-unknown` by the WASM check
# even though they are run natively, and tokio's `rt` and `macros` are among the
# features that target supports. Already in the locked graph through `orcvs`, so
# no crate enters here.
#
# `test-util` is for `start_paused`: a test that delivers a run's first Tick
# and then asserts the exact bytes a device received holds the clock still, so
# a second Tick cannot land between the two however slow the host is. `orcvs`
# declares the same feature on its own dev-dependency for the same reason.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }


[[bench]]
name = "paint"
harness = false

# The stored value is a Source the `persistence` feature serializes; without
# the feature there is nothing to measure.
[[bench]]
name = "stored_source"
harness = false
required-features = ["persistence"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

# native:
# [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# env_logger = "0.10"


# web:
# [target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen-futures = "0.4"

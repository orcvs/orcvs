[package]
name = "orcvs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `--benches` selects the library too, and its unit-test harness does not
# understand criterion's arguments.
bench = false

[features]
default = []
persistence = ["dep:serde"]

[dependencies]
lang = { path = "../lang", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tokio-util = "0.7.11"
tracing.workspace = true
web-time = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
midir = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }

# Property tests are confined to native targets. Every invariant they encode is
# platform-independent logic, so running them under `wasm-pack` adds a dependency
# graph to maintain and no signal; this `cfg` keeps proptest out of the WASM graph
# entirely. The property modules carry the matching `cfg`. See docs/tooling.md.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[bench]]
name = "source"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[package]
name = "orcvs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `--benches` selects the library too, and its unit-test harness does not
# understand criterion's arguments.
bench = false

[features]
default = []
# Platform MIDI discovery and port opening live in the console. The toolkit-free
# crate keeps the MIDI vocabulary and output adapter; it carries no platform
# MIDI or system audio dependency.
persistence = ["dep:serde"]
# Test-only. Every shipped Grid is 256 by 256 (ADR 0054), but most tests state
# their Source as a few short rows and assert on its edges, so they build a
# smaller Grid through `Grid::with_shape` and `Orcvs::with_shape`. Those two
# constructors exist only under this feature (and this crate's own `cfg(test)`),
# which is enabled solely through the workspace's dev-dependencies: this crate's
# own below, for its integration tests, benchmarks and doctests, and the
# console's. No shipped build selects it, so no shipped function takes a
# dimension only a test supplies. It adds no dependency and no code to a build
# that does not name it.
test-grid-shapes = []

[dependencies]
lang = { path = "../lang", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
# `sync` is declared rather than borrowed. ADR 0041 has the Playback Engine
# publish its lifecycle state through a `watch`, its diagnostics through an
# `mpsc`, and its transitions through a second `mpsc`, so `tokio::sync` is a
# direct requirement of this crate and is stated where it is used.
#
# `tokio-util` is gone with it. It was here for `CancellationToken`, which
# existed only to wake a retired clock task out of its sleep; ADR 0041 leaves
# one task that owns its own deadlines, so there is nothing asleep for a second
# party to wake and no other user of the crate in the workspace.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# This crate itself, with `test-grid-shapes`: the only way a Cargo package turns
# a feature on for its own integration tests, benchmarks and doctests without
# every test invocation having to name it. A dev-dependency never reaches a
# normal build, so the shipped library is compiled without it.
orcvs = { path = ".", features = ["test-grid-shapes"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }

# Property tests are confined to native targets. Every invariant they encode is
# platform-independent logic, so running them under `wasm-pack` adds a dependency
# graph to maintain and no signal; this `cfg` keeps proptest out of the WASM graph
# entirely. The property modules carry the matching `cfg`. See docs/tooling.md.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[bench]]
name = "source"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

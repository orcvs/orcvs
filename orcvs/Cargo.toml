[package]
name = "orcvs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `--benches` selects the library too, and its unit-test harness does not
# understand criterion's arguments.
bench = false

[features]
default = ["native-midi"]
# The one backend that talks to a platform MIDI service, and the `midir`
# dependency that reaches it. It is `native-midi` rather than `midi` because the
# MIDI vocabulary — destinations, backends, output adapters, Play Commands —
# is present either way; what the feature gates is the backend beneath it. On by
# default, so every build that exists today resolves identically. Off, a running
# Orcvs still composes, executes, and renders Source exactly as before and still
# has a MIDI output adapter; what it gives up is delivery, because the adapter
# holds a backend that offers no destination and refuses to connect. The tree
# then carries neither `midir` nor a system audio library.
# `orcvs/src/native_midi.rs` is the one place that chooses between the two.
native-midi = ["dep:midir"]
persistence = ["dep:serde"]

[dependencies]
lang = { path = "../lang", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
# `sync` is declared rather than borrowed. ADR 0040 has the Playback Engine
# publish its lifecycle state through a `watch`, its diagnostics through an
# `mpsc`, and its transitions through a second `mpsc`, so `tokio::sync` is a
# direct requirement of this crate and is stated where it is used.
#
# `tokio-util` is gone with it. It was here for `CancellationToken`, which
# existed only to wake a retired clock task out of its sleep; ADR 0040 leaves
# one task that owns its own deadlines, so there is nothing asleep for a second
# party to wake and no other user of the crate in the workspace.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
web-time = "1.1.0"

# The feature says whether Orcvs wants a native MIDI backend; this table says
# where one could exist. Both conditions are needed: a WASM build never sees
# `midir` whatever the feature is set to, and a native build sees it only
# through `native-midi`.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
midir = { version = "0.11", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }

# Property tests are confined to native targets. Every invariant they encode is
# platform-independent logic, so running them under `wasm-pack` adds a dependency
# graph to maintain and no signal; this `cfg` keeps proptest out of the WASM graph
# entirely. The property modules carry the matching `cfg`. See docs/tooling.md.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[bench]]
name = "source"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

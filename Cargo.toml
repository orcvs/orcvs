[workspace]
members = ["lang", "orcvs", "shell"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
arrayvec = { version = "0.7.4", default-features = false }
# Defaults off, `std` on. `std` is what the `proptest-regressions` counterexample
# files are written through, so it is the one feature persistence needs. `fork` and
# `timeout` — and the `rusty-fork` and `tempfile` trees behind them — buy nothing
# for properties over pure logic, and `bit-set` only swaps proptest's internal
# bitset for a faster one at the cost of pulling `bit-set` 0.8 and `bit-vec` 0.8
# alongside the 0.10 and 0.9 the WASM stack already resolves. Two crates and two
# duplicate versions for a shrinking micro-optimisation is the wrong trade.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
thiserror = "2.0.20"
tokio = { version = "1.39.2", default-features = false }
tracing = { version = "0.1.40", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
debug = true
[profile.dev.package]
serde_derive.opt-level = 3
syn.opt-level = 3
quote.opt-level = 3
proc-macro2.opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
strip = "symbols"
lto = true

# `bench` inherits `release`. Full LTO across criterion's tree is a slow link on every
# merge run, and stripped symbols make a local profiling run much less useful. A
# comparison gate needs a profile identical between runs, not one identical to the
# shipped binary.
[profile.bench]
lto = "thin"
strip = "none"

[profile.profiling]
inherits = "release"
debug = true

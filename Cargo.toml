[workspace]
members = ["console", "lang"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
arrayvec = { version = "0.7.4", default-features = false }
criterion = { version = "0.5.1", default-features = false }
thiserror = "1.0.64"
tracing = { version = "0.1.40", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
debug = true
[profile.dev.package]
serde_derive.opt-level = 3
syn.opt-level = 3
quote.opt-level = 3
proc-macro2.opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
strip = "symbols"
lto = true

[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.profiling]
inherits = "release"
debug = true

[package]
name = "synth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` is the WASM module the site's AudioWorklet instantiates (ADR 0087);
# `rlib` is what the crate's tests and any Rust caller link.
crate-type = ["rlib", "cdylib"]

[package]
name = "synth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` is the WASM module the site's AudioWorklet instantiates;
# `rlib` is what the crate's tests and any Rust caller link.
crate-type = ["rlib", "cdylib"]
# `cargo bench` would otherwise also run the unit-test harness, which does not
# understand criterion's arguments.
bench = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "synth"
harness = false
